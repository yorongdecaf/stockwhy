name: Probe price sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: KRX 정규장 종가 경로 찾기 (11/06 정답 NAVER +2.87, SK스퀘어 -10.51, SK하이닉스 -10.44)
        run: |
          mkdir -p data/prices/_probe && cd data/prices/_probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          : > _status.txt
          get() { code=$(curl -sS -m 20 -A "$UA" -e "https://finance.naver.com/" -o "$1" -w "%{http_code}" "$2" || echo ERR); echo "$code $(wc -c < "$1") $1 $2" | tee -a _status.txt; }
          for c in 035420 402340 000660; do
            get "fchart_$c.xml" "https://fchart.stock.naver.com/sise.nhn?symbol=$c&timeframe=day&count=6&requestType=0"
            get "siseJson_$c.txt" "https://api.finance.naver.com/siseJson.naver?symbol=$c&requestType=1&startTime=20261104&endTime=20261110&timeframe=day"
            get "sise_day_$c.html" "https://finance.naver.com/item/sise_day.naver?code=$c&page=1"
            get "mprice_krx_$c.json" "https://m.stock.naver.com/api/stock/$c/price?pageSize=5&page=1&tradeType=KRX"
            get "chart_$c.json" "https://api.stock.naver.com/chart/domestic/item/$c/day?startDateTime=202611040000&endDateTime=202611102359"
            get "yahoo_$c.json" "https://query1.finance.yahoo.com/v8/finance/chart/$c.KS?range=1mo&interval=1d"
          done
          get "mv_kospi_now.json" "https://m.stock.naver.com/api/stocks/marketValue/KOSPI?page=1&pageSize=5"
          get "basic_035420.json" "https://m.stock.naver.com/api/stock/035420/basic"
      - name: 저장
        run: |
          git config user.name "stockwhy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices/_probe
          git commit -m "시세 출처 점검 결과 [skip ci]" && git push
