name: Publish to Instagram

# posts/ 아래에 새 게시물 폴더가 올라오면 자동 게시
# Actions 탭에서 폴더를 지정해 수동 실행도 가능
on:
  push:
    branches: [main]
    paths: ["posts/**/post.json"]
  workflow_dispatch:
    inputs:
      folder:
        description: "게시할 폴더 (예: posts/us_2026-10-30)"
        required: true
      dry_run:
        description: "true면 실제 게시 없이 점검만"
        default: "false"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"   # 로그가 바로바로 보이게

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 게시할 폴더 찾기
        id: find
        run: |
          if [ -n "${{ github.event.inputs.folder }}" ]; then
            echo "folders=${{ github.event.inputs.folder }}" >> "$GITHUB_OUTPUT"
          else
            F=$(git diff --name-only HEAD~1 HEAD -- 'posts/**/post.json' | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
            echo "folders=$F" >> "$GITHUB_OUTPUT"
          fi

      - name: 인스타그램 게시
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          for f in ${{ steps.find.outputs.folders }}; do
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              python publisher/publish.py "$f" --dry-run
            else
              python publisher/publish.py "$f"
            fi
          done

      - name: 스레드 게시
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          for f in ${{ steps.find.outputs.folders }}; do
            python publisher/threads.py "$f"
          done

      - name: 게시 기록 저장 (중복 게시 방지)
        if: always()            # 중간에 실패·중단돼도 올라간 것까지는 기록
        run: |
          git config user.name "stockwhy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/*/published.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "게시 완료 기록 [skip ci]" && git push)
